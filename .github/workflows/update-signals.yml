name: Update market signals

on:
  schedule:
    # 05:00 UTC = 12:00 Bangkok time, every day (after all global markets
    # referenced have at least one settled daily close)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch global ETF/Index/crypto signals
        run: python scripts/fetch_signals.py

      - name: Fetch SET100 (Thai stocks) signals
        run: python scripts/fetch_set100_signals.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/set100_signals.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily market signals update"
            git push
          else
            echo "No changes to commit."
          fi
